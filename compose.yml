services:
  mcrouter:
    image: ${MCROUTER_IMAGE:-ghcr.io/dragoangel/mcrouter:latest}
    depends_on:
      - cache
    ports:
      - "5000:5000"
    command:
      - '--config-str={"pools":{"A":{"servers":["cache:11211"]}},"route":"PoolRoute|A"}'
      - -p
      - "5000"

  cache:
    image: memcached:alpine
