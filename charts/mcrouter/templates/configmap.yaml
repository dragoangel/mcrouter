apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcrouter.fullname" . }}
  labels:
    {{- include "mcrouter.labels" . | nindent 4 }}
data:
  config.json: |-
{{- if .Values.config }}
    {{ .Values.config | nindent 4}}
{{- else }}
    {{- if .Values.memcached.enabled }}
    {
      "pools": {
        "A": {
          "servers": [
            // hosts of replicated pool, https://github.com/facebook/mcrouter/wiki/Replicated-pools-setup e.g.:
            {{- $global := . }}
            {{- range $i, $e := until (.Values.memcached.replicaCount | int) }}
            "{{ $global.Release.Name }}-memcached-{{ $i }}.{{ $global.Release.Name }}-memcached.{{ $global.Release.Namespace }}.svc.{{ $global.Values.clusterSuffix }}:11211",
            {{- end }}
          ]
        }
      },
      "route": {
        "type": "OperationSelectorRoute",
        "default_policy": "PoolRoute|A",
        "operation_policies": {
          "add": "AllFastestRoute|Pool|A",
          "delete": "AllFastestRoute|Pool|A",
          "get": "LatestRoute|Pool|A",
          "set": "AllFastestRoute|Pool|A",
          "incr": "AllFastestRoute|Pool|A",
          "decr": "AllFastestRoute|Pool|A"
        }
      }
    }
    {{- end }}
{{- end }}
