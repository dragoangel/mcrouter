version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      gh-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]
    # The ubuntu base image is bumped by hand: upstream
    # mcrouter must support the new OS first.
    ignore:
      - dependency-name: ubuntu
    commit-message:
      prefix: chore
      include: scope
