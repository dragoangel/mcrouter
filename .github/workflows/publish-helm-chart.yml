name: Publish Helm Chart

on:
  push:
    branches:
      - master
      - main
    paths:
      - charts/**
      - .github/workflows/publish-helm-chart.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
  CHART: ghcr.io/${{ github.repository_owner }}/charts/mcrouter

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Lint, render, and check images
        run: bash scripts/helm-lint.sh

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package, push, and sign chart (OCI)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          helm dependency build charts/mcrouter
          ver="$(sed -n 's/^version: *//p' charts/mcrouter/Chart.yaml)"
          # Publishing the same chart version twice is a no-op — skip if it exists.
          if helm show chart "${REPO}/mcrouter" --version "$ver" >/dev/null 2>&1; then
            echo "Chart mcrouter $ver already published to ${REPO}; skipping."
            exit 0
          fi
          helm package charts/mcrouter --destination /tmp/pkg
          out="$(helm push "/tmp/pkg/mcrouter-${ver}.tgz" "$REPO" 2>&1)"
          echo "$out"
          digest="$(echo "$out" | awk '/[Dd]igest:/ {print $NF}')"
          test -n "$digest"
          cosign sign "${CHART}@${digest}"
