name: Publish Artifact Hub metadata

on:
  push:
    branches:
      - master
      - main
    paths:
      - artifacthub-repo.yml
      - .github/workflows/publish-artifacthub-meta.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CHART: ghcr.io/${{ github.repository_owner }}/charts/mcrouter

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up ORAS
        uses: oras-project/setup-oras@v2

      - name: Publish Artifact Hub metadata
        run: |
          set -euo pipefail
          f=artifacthub-repo.yml
          if [ ! -f "$f" ]; then
            echo "No $f found; nothing to publish."
            exit 0
          fi
          id="$(sed -n 's/^repositoryID:[[:space:]]*//p' "$f" | tr -d '"' | head -n1)"
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if ! [[ "$id" =~ $uuid ]]; then
            echo "repositoryID in $f is not a valid UUID ('${id:-unset}'); skipping."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push "${CHART}:artifacthub.io" \
            "${f}:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"
