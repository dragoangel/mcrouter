name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build image (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read pinned mcrouter version
        id: ver
        run: echo "version=$(cat build.mcrouter.lock)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            MCROUTER_VERSION=${{ steps.ver.outputs.version }}
          # Read-only: consume the cache the master publish writes (shared scope).
          # CI never writes it, so it can't evict/fragment master's layers, and
          # branches still warm-start (GHA restores the default-branch cache).
          cache-from: type=gha,scope=image-amd64

  chart:
    name: chart lint + render + drift
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a chart version bump when the chart changes
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          if git diff --quiet "$base" HEAD -- charts/mcrouter; then
            echo "chart unchanged; no version bump required"
            exit 0
          fi
          new="$(sed -n 's/^version: *//p' charts/mcrouter/Chart.yaml)"
          old="$(git show "$base:charts/mcrouter/Chart.yaml" 2>/dev/null | sed -n 's/^version: *//p' || true)"
          if [ "$new" = "$old" ]; then
            echo "::error::charts/mcrouter changed but Chart.yaml version ($new) was not bumped — chart-releaser won't publish it."
            exit 1
          fi
          echo "chart version bumped: ${old:-none} -> $new"

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Lint and render (both controllers)
        run: |
          helm dependency build charts/mcrouter
          helm lint charts/mcrouter
          helm template t charts/mcrouter >/dev/null
          helm template t charts/mcrouter --set deploymentType=DaemonSet >/dev/null

      - name: artifacthub.io/images matches rendered images
        run: |
          set -euo pipefail
          # Images the chart actually deploys at its defaults (metrics sidecar on,
          # memcached subchart off — the subchart documents its own image).
          rendered="$(helm template t charts/mcrouter \
            --set metrics.enabled=true --set memcached.enabled=false \
            | grep -oE '^[[:space:]]*image:[[:space:]]*\S+' \
            | awk '{print $2}' | sort -u)"
          # Images declared in the artifacthub.io/images annotation.
          declared="$(helm show chart charts/mcrouter \
            | yq -r '.annotations."artifacthub.io/images"' \
            | yq -r '.[].image' | sort -u)"
          if ! diff <(echo "$rendered") <(echo "$declared") >/dev/null; then
            echo "::error::artifacthub.io/images is out of sync with the images the chart renders (< rendered, > declared):"
            diff <(echo "$rendered") <(echo "$declared") || true
            exit 1
          fi
          echo "artifacthub.io/images matches rendered images"

      - name: values.schema.json and README.md are up to date
        run: |
          helm plugin install https://github.com/losisin/helm-values-schema-json --version v2.5.0 --verify=false
          go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2
          export PATH="$PATH:$(go env GOPATH)/bin"
          bash scripts/helm-gen-docs-and-schema.sh
          git diff --exit-code charts/mcrouter/values.schema.json charts/mcrouter/README.md \
            || { echo "::error::values.schema.json / README.md are stale — run scripts/helm-gen-docs-and-schema.sh"; exit 1; }
